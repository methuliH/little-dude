<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file:">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #wrap { position: absolute; inset: 10px; transition: transform .15s; }
  #wrap.left { transform: scaleX(-1); }
  img { width: 100%; height: 100%; object-fit: contain; animation: flap .22s ease-in-out infinite alternate; transform-origin: 40% 60%; }
  @keyframes flap { from { transform: rotate(-10deg) scaleY(1.06); } to { transform: rotate(8deg) scaleY(.9) translateY(3px); } }
</style>
</head>
<body>
<div id="wrap"><img src="assets/bird.png"></div>
<script>
  window.pet.on('dir', d => document.getElementById('wrap').classList.toggle('left', d < 0));
</script>
</body>
</html>
